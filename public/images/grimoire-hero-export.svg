<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" data-plotter="" data-plotter-unit="25" data-center="280 170" data-radius="100" fill="none" stroke="#171717" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" role="img" aria-labelledby="grimoire-hero-title" style="color:#171717;font-family:Cal Sans, sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400" aria-describedby="grimoire-hero-desc">
  <title id="grimoire-hero-title">Squared circle on an open grimoire</title>
  <desc id="grimoire-hero-desc">An open book of two square pages is the base. A circle rises from the spine, tangent to the pages, and its diameter equals the book’s width. The same center holds a square, a triangle, and an inner circle. Elemental triangles stand at the cardinal points, and Sol, Luna, Saturn, and Mercury sit on the outer pitch.</desc>
